name: Historia de usuario
description: Un elemento del Product Backlog con valor para el usuario
title: "HU-XX: "
labels: ["historia"]

body:
  - type: textarea
    id: historia
    attributes:
      label: Historia
      description: Como [usuario], quiero [acción] para [beneficio].
      placeholder: Como usuario, quiero ... para ...
    validations:
      required: true

  - type: textarea
    id: criterios
    attributes:
      label: Criterios de aceptación
      description: Se completan en formato Dado / Cuando / Entonces.
      value: |
        - [ ] Dado ...
              Cuando ...
              Entonces ...
    validations:
      required: true

  - type: dropdown
    id: prioridad
    attributes:
      label: Prioridad (MoSCoW)
      options:
        - Must
        - Should
        - Could
    validations:
      required: true

  - type: textarea
    id: notas
    attributes:
      label: Notas técnicas o dudas
      description: Información técnica, dependencias o dudas relacionadas con la historia.
      placeholder: Dependencias, tablas de Supabase, servicios, pantallas, etc.
    validations:
      required: false
